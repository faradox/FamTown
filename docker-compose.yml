x-all: &all
  DATABASE_URL: ${FAMTOWN_DATABASE_URL:-postgresql://admin:admin@postgres:5432/famtown}
  JWT_SECRET_KEY: "${FAMTOWN_JWT_SECRET_KEY:-dev-secret-key-for-development-super-long-enough-for-security}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  APP_NAME: ${APP_NAME:-FamTown}
  APP_DESCRIPTION: ${APP_DESCRIPTION:-Family home dashboard API}
  FRONTEND_URL: ${FAMTOWN_FRONTEND_URL:-http://localhost:3000}
  PORT: ${FAMTOWN_PORT:-8000}
x-dev: &dev
  DEBUG: "true"
  LOG_LEVEL: "INFO"
x-prod: &prod
  DEBUG: "false"
  LOG_LEVEL: "WARNING"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FAMTOWN_API_URL:-}
        VITE_WS_URL: ${FAMTOWN_WS_URL:-}
        VITE_UI_THEME: ${FAMTOWN_UI_THEME:-famtown}
        VITE_APP_NAME: ${FAMTOWN_APP_NAME:-FamTown}
        VITE_APP_SHORT_NAME: ${FAMTOWN_APP_SHORT_NAME:-FamTown}
        VITE_APP_DESCRIPTION: ${FAMTOWN_APP_DESCRIPTION:-A shared family home dashboard.}
        VITE_AUTH_TOKEN_KEY: ${FAMTOWN_AUTH_TOKEN_KEY:-famtown_auth_token}
    image: famtown-frontend:latest
    container_name: famtown-frontend
    restart: unless-stopped
    ports:
      # Loopback only: host nginx terminates TLS and proxies here
      - "127.0.0.1:8069:80"
    environment:
      - VITE_API_URL=${FAMTOWN_API_URL:-}
      - VITE_WS_URL=${FAMTOWN_WS_URL:-}
      - VITE_UI_THEME=${FAMTOWN_UI_THEME:-famtown}
      - VITE_APP_NAME=${FAMTOWN_APP_NAME:-FamTown}
      - VITE_APP_SHORT_NAME=${FAMTOWN_APP_SHORT_NAME:-FamTown}
      - VITE_APP_DESCRIPTION=${FAMTOWN_APP_DESCRIPTION:-A shared family home dashboard.}
      - VITE_AUTH_TOKEN_KEY=${FAMTOWN_AUTH_TOKEN_KEY:-famtown_auth_token}
    profiles: ["prod"]

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: famtown-frontend-dev:latest
    container_name: famtown-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${FAMTOWN_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${FAMTOWN_WS_URL:-ws://localhost:8000}
      - CHOKIDAR_USEPOLLING=true
      - VITE_UI_THEME=${FAMTOWN_UI_THEME:-famtown}
      - VITE_APP_NAME=${FAMTOWN_APP_NAME:-FamTown}
      - VITE_APP_SHORT_NAME=${FAMTOWN_APP_SHORT_NAME:-FamTown}
      - VITE_APP_DESCRIPTION=${FAMTOWN_APP_DESCRIPTION:-A shared family home dashboard.}
      - VITE_AUTH_TOKEN_KEY=${FAMTOWN_AUTH_TOKEN_KEY:-famtown_auth_token}
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules
    stdin_open: true
    tty: true
    profiles: ["dev"]

  # Backend services
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${uid:-1000}
        GROUP_ID: ${gid:-1000}
    image: famtown-backend:latest
    container_name: famtown-backend
    restart: unless-stopped
    ports:
      # Loopback only: host nginx terminates TLS and proxies here
      - "127.0.0.1:8001:8000"
    environment:
      <<: [*all, *prod]
    volumes:
      - ${FAMTOWN_UPLOADS_DIR:-./backend/uploads}:/app/uploads
    profiles: ["prod"]

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${uid:-1000}
        GROUP_ID: ${gid:-1000}
    image: famtown-backend-dev:latest
    container_name: famtown-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: [*all, *dev]
    volumes:
      - ./backend:/app
      - ${FAMTOWN_UPLOADS_DIR:-./backend/uploads}:/app/uploads
    command: python main.py
    profiles: ["dev"]

  # Bundled database: always in dev, and in prod via the localdb profile
  postgres:
    image: postgis/postgis:17-master
    container_name: famtown-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - 5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: famtown
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data-famtown:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d famtown"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev", "localdb"]

volumes:
  postgres-data-famtown:
    driver: local
